plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.vpnlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.vpnlauncher"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
